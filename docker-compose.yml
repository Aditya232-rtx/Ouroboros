version: '3.8'

services:
  # PostgreSQL - Primary database
  postgres:
    image: postgres:15-alpine
    container_name: ouroboros-postgres
    environment:
      POSTGRES_DB: ouroboros
      POSTGRES_USER: ouroboros_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ouroboros_user -d ouroboros" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ouroboros_network

  # Redis - Caching layer
  redis:
    image: redis:7-alpine
    container_name: ouroboros-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ouroboros_network

  # immudb - Immutable audit logging
  immudb:
    image: codenotary/immudb:latest
    container_name: ouroboros-immudb
    environment:
      IMMUDB_ADMIN_PASSWORD: ${IMMUDB_PASSWORD:-immudb}
      IMMUDB_DATABASE: ouroboros_audit
    ports:
      - "3322:3322"
    volumes:
      - immudb_data:/var/lib/immudb
    healthcheck:
      test: [ "CMD", "sh", "-c", "exit 0" ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ouroboros_network

  # OPA - Policy engine
  opa:
    image: openpolicyagent/opa:latest
    container_name: ouroboros-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    ports:
      - "8181:8181"
    volumes:
      - ./config/opa_policies:/policies:ro
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8181/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ouroboros_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  immudb_data:
    driver: local

networks:
  ouroboros_network:
    driver: bridge
